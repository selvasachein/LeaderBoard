<style>
:root {
    --navy: #111827;
    --gold: #facc15;
    --red: #dc2626;
    --text: #1f2937;
    --muted: #64748b;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    padding: 25px 15px;

    background: linear-gradient(
        135deg,
        #dc2626,
        #facc15,
        #dc2626,
        #f59e0b,
        #b91c1c
    );

    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    max-width: 1250px;
    margin: auto;
    background: rgba(255,255,255,0.97);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

/* HEADER */

header {
    background: linear-gradient(135deg,#111827,#273449);
    padding: 30px 20px;
    text-align: center;
    border-bottom: 5px solid var(--gold);
}

.logo img {
    max-width: 90%;
    max-height: 105px;
    object-fit: contain;
    margin-bottom: 20px;
}

.heading {
    color: var(--gold);
    font-size: clamp(19px,3vw,32px);
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.4;
    text-transform: uppercase;
}

.subheading {
    color: #e5e7eb;
    margin-top: 10px;
    font-size: 14px;
    letter-spacing: 2px;
}

/* TOP SUMMARY */

.summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    padding: 22px 25px;
    background: #f8fafc;
    border-bottom: 1px solid #e5e7eb;
}

.summary-title {
    font-size: 20px;
    font-weight: 800;
    color: #111827;
}

.student-count {
    background: #111827;
    color: #facc15;
    padding: 10px 18px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 14px;
}

/* SEARCH */

.search-area {
    padding: 18px 25px;
    background: white;
}

.search-area input {
    width: 100%;
    padding: 15px 18px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
    transition: 0.3s;
}

.search-area input:focus {
    border-color: #dc2626;
    box-shadow: 0 0 0 4px rgba(220,38,38,0.1);
}

/* TABLE */

.table-wrapper {
    overflow-x: auto;
    padding: 0 20px 25px;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 7px;
}

thead th {
    background: #1e293b;
    color: white;
    padding: 17px 20px;
    text-align: left;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
}

thead th:first-child {
    border-radius: 10px 0 0 10px;
    text-align: center;
}

thead th:last-child {
    border-radius: 0 10px 10px 0;
    text-align: right;
}

tbody tr {
    background: #f8fafc;
    transition: 0.25s;
}

tbody tr:hover {
    transform: scale(1.008);
    background: #fef3c7;
    box-shadow: 0 5px 15px rgba(0,0,0,0.07);
}

tbody td {
    padding: 15px 20px;
    border-top: 1px solid #e5e7eb;
    border-bottom: 1px solid #e5e7eb;
    font-size: 14px;
}

tbody td:first-child {
    border-left: 1px solid #e5e7eb;
    border-radius: 10px 0 0 10px;
    text-align: center;
}

tbody td:last-child {
    border-right: 1px solid #e5e7eb;
    border-radius: 0 10px 10px 0;
    text-align: right;
}

.ref-code {
    font-family: Consolas, monospace;
    font-weight: 700;
    color: #475569;
}

.student-name {
    font-weight: 700;
    color: #1e293b;
}

.marks {
    display: inline-block;
    background: #e2e8f0;
    padding: 7px 13px;
    border-radius: 8px;
    font-weight: 800;
    color: #111827;
}

/* TOP THREE */

.rank-1 {
    background: linear-gradient(90deg,#fef08a,#fde047) !important;
    font-weight: 800;
}

.rank-2 {
    background: linear-gradient(90deg,#f1f5f9,#cbd5e1) !important;
    font-weight: 800;
}

.rank-3 {
    background: linear-gradient(90deg,#fed7aa,#fdba74) !important;
    font-weight: 800;
}

.rank-1 td:first-child { border-left: 6px solid #eab308; }
.rank-2 td:first-child { border-left: 6px solid #94a3b8; }
.rank-3 td:first-child { border-left: 6px solid #d97706; }

.rank-badge {
    display: inline-block;
    background: rgba(255,255,255,0.8);
    padding: 7px 12px;
    border-radius: 25px;
    font-weight: 900;
    color: #111827;
    white-space: nowrap;
}

.medal {
    font-size: 20px;
    vertical-align: middle;
}

/* FOOTER */

footer {
    background: #111827;
    color: #cbd5e1;
    text-align: center;
    padding: 23px 15px;
    border-top: 4px solid #facc15;
    font-size: 14px;
}

footer a {

    text-decoration: none;
    font-weight: 800;
    transition: 0.3s;
}

footer a:hover {

    text-decoration: underline;
}

/* MOBILE */

@media(max-width:640px) {

}

@media(prefers-reduced-motion:reduce) {

}

/* RANKING */

const rankingBody = document.getElementById("rankingBody");
const searchInput = document.getElementById("searchInput");
const studentCount = document.getElementById("studentCount");

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function getRank(rank) {
    if (rank === 1)
        return '<span class="rank-badge"><span class="medal">🥇</span> 1st</span>';

    if (rank === 2)
        return '<span class="rank-badge"><span class="medal">🥈</span> 2nd</span>';

    if (rank === 3)
        return '<span class="rank-badge"><span class="medal">🥉</span> 3rd</span>';

    return `<strong>#${rank}</strong>`;
}

function renderTable() {

    const sorted = [...studentData].sort((a,b) =>
        b.marks - a.marks
    );

    const query = searchInput.value.trim().toLowerCase();

    const filtered = sorted
        .map((student,index) => ({
            ...student,
            rank: index + 1
        }))
        .filter(student =>
            student.ref.toLowerCase().includes(query) ||
            student.name.toLowerCase().includes(query)
        );

    studentCount.textContent =
        `Showing ${filtered.length} of ${studentData.length} Students`;

    rankingBody.innerHTML = filtered.map(student => {

        const rankClass =
            student.rank === 1 ? "rank-1" :
            student.rank === 2 ? "rank-2" :
            student.rank === 3 ? "rank-3" : "";

        return `
            <tr class="${rankClass}">
                <td>${getRank(student.rank)}</td>
                <td class="ref-code">${escapeHtml(student.ref)}</td>
                <td class="student-name">${escapeHtml(student.name)}</td>
                <td><span class="marks">${student.marks.toFixed(2)}</span></td>
            </tr>
        `;
    }).join("");

    if (filtered.length === 0) {
        rankingBody.innerHTML = `
            <tr>
                <td colspan="4" style="text-align:center;padding:35px;color:#64748b;">
                    No students found.
                </td>
            </tr>
        `;
    }
}

searchInput.addEventListener("input", renderTable);
